name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate commands.json
        run: node scripts/validate-commands.js
      - name: Run omnibar tests
        run: node test/omnibar.test.js
